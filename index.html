<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sets">
  <title>Counter Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/gridstack/gridstack.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <div class="grid-stack" id="grid">
      <div class="grid-stack-item" id="timer">
        <section class="grid-stack-item-content panel panel-timer" aria-label="Rest timer">
          <p class="label">Rest</p>
          <output class="big" id="timer-value" aria-live="off">0:00</output>
          <button type="button" class="reset" id="reset">Reset</button>
        </section>
      </div>
      <div class="grid-stack-item" id="counter">
        <section class="grid-stack-item-content panel panel-counter" role="button" tabindex="0"
                 aria-label="Add a set and restart the timer">
          <p class="label">Sets</p>
          <output class="big" id="counter-value" aria-live="polite">0</output>
          <p class="hint">Tap to add a set &amp; restart timer</p>
        </section>
      </div>
    </div>
  </main>
  <script src="vendor/gridstack/gridstack-all.js"></script>
  <script src="app.js"></script>
</body>
</html>
