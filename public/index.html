<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter Timer">
  <title>Counter Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/gridstack/gridstack.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <div class="grid-stack" id="grid">
      <div class="grid-stack-item" id="timer">
        <section class="grid-stack-item-content panel panel-timer" aria-label="Rest timer">
          <button type="button" class="chip target-chip" id="target-chip">Target off</button>
          <div class="top-actions">
            <button type="button" class="chip icon" id="sound-toggle" aria-pressed="false" aria-label="In-app sound">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/>
                <path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>
                <path class="sound-off" d="m16 9 6 6m0-6-6 6"/>
              </svg>
            </button>
            <button type="button" class="chip" id="reset">Reset</button>
          </div>
          <p class="label">Rest</p>
          <output class="big" id="timer-value" aria-live="off">0:00</output>
          <div class="status">
            <button type="button" class="chip accent" id="enable-alerts" hidden>Enable alerts</button>
            <p class="note" id="install-hint" hidden>Add to Home Screen to get notifications</p>
            <p class="note warn" id="offline-badge" hidden>Offline, in-app alert only</p>
          </div>
          <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div></div>
        </section>
      </div>
      <div class="grid-stack-item" id="counter">
        <section class="grid-stack-item-content panel panel-counter" role="button" tabindex="0"
                 aria-label="Add a set and restart the timer">
          <p class="label">Sets</p>
          <output class="big" id="counter-value" aria-live="polite">0</output>
          <p class="hint">Tap to add a set &amp; restart timer</p>
        </section>
      </div>
    </div>
  </main>
  <dialog class="target-dialog" id="target-dialog">
    <form method="dialog" id="target-form">
      <h2>Target rest</h2>
      <div class="presets">
        <button type="button" data-seconds="60">1:00</button>
        <button type="button" data-seconds="90">1:30</button>
        <button type="button" data-seconds="120">2:00</button>
        <button type="button" data-seconds="180">3:00</button>
      </div>
      <div class="time-inputs">
        <label>Min <input type="number" id="target-min" inputmode="numeric" min="0" max="59" value="1"></label>
        <span>:</span>
        <label>Sec <input type="number" id="target-sec" inputmode="numeric" min="0" max="59" value="30"></label>
      </div>
      <div class="dialog-actions">
        <button type="submit" value="off">Turn off</button>
        <button type="submit" value="cancel">Cancel</button>
        <button type="submit" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>
  <script src="vendor/gridstack/gridstack-all.js"></script>
  <script src="app.js"></script>
</body>
</html>
